services:
  jenkins:
    container_name: jenkins-ansible-container  # Name of the Jenkins container for easy reference
    image: jenkins-ansible-image   # Official Jenkins Docker image with ansible installed
    build:
      context: jenkins_ansible  # Build the jenkins image from the 'jenkins_ansible' directory
    ports:
      - 8080:8080  # Map port 8080 on the host to port 8080 in the container (Jenkins web UI)
    volumes:
      - $PWD/jenkins_home:/var/jenkins_home  # Persist Jenkins data by mounting a local directory
    networks:
      - net  # Connect Jenkins to the custom Docker network for communication with other containers

  remote-alpine:
    container_name: remote-alpine-container # Name of the remote host container
    image: remote-alpine-image          # Use the remote-host Docker image
    build:
      context: alpine  # Build the remote_host image from the 'alpine' directory
    volumes:
      - $PWD/scripts/:/tmp/  # Mount the backup script into the container
    networks:
      - net  # Connect this container to the same network as Jenkins for inter-container communication

  db:
    container_name: mariadb-container  # Name of the database container
    image: mariadb:noble      # Official mariadb image
    environment:
      MARIADB_ROOT_PASSWORD: 1234  # Root password for mariadb
    volumes:
      - $PWD/db_data:/var/lib/mysql  # Persist MySQL data by mounting a local directory
    networks:
      - net  # Connect the database container to the same network as Jenkins and remote_host
  web:
    container_name: web-container  # Name of the web server container
    image: php:apache               # Official PHP Apache image
    ports:
      - 8090:80  # Map port 8090 on the host to port 80 in the container (Nginx web server)
    volumes:
      - $PWD/web_data:/var/www/html  # Mount local web_data directory to the web server's document root
    networks:
      - net  # Connect the web server container to the same network as Jenkins and remote_host
    
  probe:
    container_name: probe-container  # Name of the probe container
    image: probe-image           # Use the probe Docker image
    build:
      context: probe  # Build the remote_host image from the 'alpine' directory
    networks:
      - net  # Connect this container to the same network as Jenkins for inter-container communication
  
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab-container
    hostname: 'gitlab.example.com'
    ports:
      - 8070:80
    volumes:
      - '$PWD/gitlab/config:/etc/gitlab'
      - '$PWD/gitlab/logs:/var/log/gitlab'
      - '$PWD/gitlab/data:/var/opt/gitlab'

# Define a custom Docker network for inter-container communication
networks:
  net:  # Custom network that allows containers to communicate using container names
